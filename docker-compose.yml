services:
  postgres:
    image: postgres:17-alpine
    container_name: millets-momo-db
    environment:
      POSTGRES_USER: momo
      POSTGRES_PASSWORD: MomoDev2024!
      # Created on first start, so there is no separate create-database step.
      POSTGRES_DB: millets_momo
    ports:
      - "5432:5432"
    volumes:
      - momo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momo -d millets_momo"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  momo-pgdata:
