name: Maintain Storage

on:
  # No longer scheduled — the ~16MB ADR/PVS overhead this fights was significant
  # against a 32MB quota but is a rounding error against the current 32GB free-tier
  # database. Routine shrinking has a real fragmentation cost with no offsetting
  # benefit once space isn't scarce. Kept as a manual tool in case it's ever needed.
  workflow_dispatch: {}

jobs:
  maintain:
    runs-on: ubuntu-latest
    environment: production
    name: Reclaim DB storage (rebuild + shrink)
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reclaim storage
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SQL_PORT: '1433'
          SQL_ENCRYPT: 'true'
          SQL_TRUST_CERT: 'false'
        run: npm run prod:maintain:storage
