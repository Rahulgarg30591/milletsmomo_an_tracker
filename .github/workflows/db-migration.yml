name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      run_seed:
        description: 'Run seed.sql after schema?'
        required: false
        default: false
        type: boolean
      confirm:
        description: 'schema.sql DROPS every table. Type DROP AND RECREATE to proceed.'
        required: true
        default: ''
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    name: Run Schema Migration
    steps:
      # schema.sql begins with DROP TABLE on all 14 tables, so a mis-click here
      # destroys production. Nothing is checked out until the phrase matches.
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DROP AND RECREATE" ]; then
            echo "::error::Refusing to run. This workflow drops every table and recreates it from schema.sql."
            echo "::error::Re-run and type exactly: DROP AND RECREATE"
            exit 1
          fi
          echo "Confirmation accepted."

      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run prod:db:migrate

      - name: Run seed data
        if: ${{ github.event.inputs.run_seed == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run prod:db:seed
