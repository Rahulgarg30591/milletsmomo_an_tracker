name: Purge Old Logs

on:
  # No longer scheduled — this existed to keep ClientActivityLogs/StaffOperationLogs
  # from filling a 32MB database. At current volume, years of unpurged logs are
  # trivial against the current 32GB free-tier database. Kept as a manual tool.
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: production
    name: Purge logs older than 72h
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Purge old logs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run prod:logs:purge
